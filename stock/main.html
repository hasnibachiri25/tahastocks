<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#14213d;--muted:#6b7280;--line:#e5e7eb;--accent:#0A2D6B;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#171e2e;--ink:#e6eaf2;--muted:#9aa4b5;--line:#263047;--accent:#7aa7ff}}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);padding:16px}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:20px;margin:4px 0 12px;color:var(--accent)}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink)}
input[type=search]{width:100%;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
label.chk{display:flex;align-items:center;gap:6px;font-size:14px;margin:10px 0;color:var(--muted);cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.meta{font-size:13px;color:var(--muted);margin:6px 0 10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.des{font-size:15px;line-height:1.5;direction:ltr;text-align:left;word-break:break-word}
.tags{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);direction:ltr;margin-top:6px}
.tag{background:var(--bg);border-radius:6px;padding:2px 7px}
.qty{font-weight:700;font-size:18px;min-width:56px;text-align:center;border-radius:10px;padding:6px 8px}
.q0{background:#fee2e2;color:var(--bad)}.q1{background:#fef3c7;color:var(--warn)}.qk{background:#dcfce7;color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:30px 0}
</style>
</head>

const SYN = {"فرامل": ["frein"], "فرامله": ["frein"], "مكابح": ["frein"], "brake": ["frein"], "brakes": ["frein"], "فلتر": ["filtre"], "فلاتر": ["filtre"], "filter": ["filtre"], "filters": ["filtre"], "زيت": ["huile"], "oil": ["huile"], "محرك": ["moteur"], "engine": ["moteur"], "جوان": ["joint"], "جوانات": ["joint"], "seal": ["joint"], "gasket": ["joint"], "محمل": ["roulement"], "بلي": ["roulement"], "bearing": ["roulement"], "مضخه": ["pompe"], "مضخة": ["pompe"], "pump": ["pompe"], "كابل": ["cable"], "câble": ["cable"], "كوابل": ["cable"], "مساعد": ["amortisseur"], "امتصاص": ["amortisseur"], "shock": ["amortisseur"], "ضوء": ["optique", "feu"], "مصباح": ["optique", "feu"], "lampe": ["optique"], "light": ["feu", "optique"], "سير": ["courroie"], "courroie": ["courroie"], "belt": ["courroie"], "قابض": ["embrayage"], "كلتش": ["embrayage"], "clutch": ["embrayage"], "خرطوم": ["flexible"], "tuyau": ["flexible"], "hose": ["flexible"], "حاقن": ["injecteur", "injection"], "injecteur": ["injection"], "بطارية": ["batterie"], "battery": ["batterie"], "مروحة": ["ventilateur"], "fan": ["ventilateur"], "شاكمان": ["shacman"], "شكمان": ["shacman"], "فولفو": ["volvo"], "مان": ["man"], "مرسيدس": ["mercedes"], "هينو": ["hino"], "رينو": ["renault"], "ايفيكو": ["iveco"], "اسكار": ["askar", "arskar"]};

function norm(s){
  return String(s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[\u064B-\u065F\u0640]/g,'')
    .replace(/[إأآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
}
function toks(s){ return norm(s).split(/[^a-z0-9\u0621-\u064a]+/).filter(Boolean); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function lev(a,b){
  let p=Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){
    const c=[i];
    for(let j=1;j<=b.length;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));
    p=c;
  }
  return p[b.length];
}

const SYNN={};
for(const k in SYN){ const nk=norm(k); SYNN[nk]=(SYNN[nk]||[]).concat(SYN[k].map(norm)); }

const ROWS = DATA.map((r,i)=>{
  const [loc,des,ref,brand,qty]=r;
  const all=[des,ref,brand,loc].join(' ');
  return {i,loc,des,ref,brand,qty,T:new Set(toks(all)),C:norm(all).replace(/[^a-z0-9\u0621-\u064a]/g,'')};
});

function variants(t){
  const set=new Set([t]);
  (SYNN[t]||[]).forEach(x=>set.add(x));
  if(t.startsWith('ال')&&t.length>4) set.add(t.slice(2));
  return [...set];
}
function tokScore(v,r){
  if(r.T.has(v)) return 1;
  if(v.length>=3) for(const w of r.T) if(w.startsWith(v)) return 0.8;
  if(v.length>=3 && r.C.includes(v)) return 0.7;
  if(v.length>=5) for(const w of r.T){
    if(Math.abs(w.length-v.length)<=2 && lev(v,w)<=(v.length>=8?2:1)) return 0.6;
  }
  return 0;
}
function bestTok(t,r){
  let best=0;
  for(const v of variants(t)){ const s=tokScore(v,r); if(s>best) best=s; }
  return best;
}
function search(q){
  const qt=toks(q).filter(t=>t.length>=2);
  if(!qt.length) return [];
  const qc=norm(q).replace(/[^a-z0-9\u0621-\u064a]/g,'');
  const out=[];
  for(const r of ROWS){
    let sum=0, matched=0;
    for(const t of qt){ const s=bestTok(t,r); if(s>0){ matched++; sum+=s; } }
    if(!matched) continue;
    if(qt.length>1 && matched/qt.length<0.5) continue;
    let score=sum+(matched===qt.length?3:0);
    if(qc.length>=3 && r.C.includes(qc)) score+=4;
    if(r.qty>0) score+=0.5;
    out.push({r,score});
  }
  out.sort((a,b)=>b.score-a.score);
  return out;
}

function card(r){
  const cls=r.qty<=0?'q0':r.qty<=2?'q1':'qk';
  const tags=[
    r.ref?`<span class="tag">${esc(r.ref)}</span>`:'',
    r.brand?`<span class="tag">${esc(r.brand)}</span>`:'',
    r.loc?`<span class="tag">📍 ${esc(r.loc)}</span>`:''
  ].join('');
  return `<div class="item"><div><div class="des">${esc(r.des)}</div><div class="tags">${tags}</div></div><div class="qty ${cls}">${r.qty}</div></div>`;
}

function renderStats(){
  const total=ROWS.length, sum=ROWS.reduce((a,r)=>a+r.qty,0);
  const inS=ROWS.filter(r=>r.qty>0).length, zero=total-inS;
  document.getElementById('stats').innerHTML=
    `<span>الأصناف: <b>${total}</b></span><span>إجمالي الكمية: <b>${sum}</b></span><span>متوفر: <b>${inS}</b></span><span>نفد: <b>${zero}</b></span>`;
}

function render(){
  const q=document.getElementById('q').value.trim();
  const only=document.getElementById('inStock').checked;
  const list=document.getElementById('list'), meta=document.getElementById('meta');
  let res = q ? search(q) : ROWS.map(r=>({r,score:0})).sort((a,b)=>a.r.des.localeCompare(b.r.des,'fr'));
  if(only) res=res.filter(x=>x.r.qty>0);
  const total=res.length;
  meta.textContent = total ? (q ? `${total} نتيجة` : `${total} صنف (مرتبة أبجدياً)`) : 'لا توجد نتائج';
  list.innerHTML = total ? res.map(x=>card(x.r)).join('') : '<div class="empty">جرّب كلمة أخرى أو اكتب جزءاً من الرقم المرجعي</div>';
}

document.getElementById('q').addEventListener('input',render);
document.getElementById('inStock').addEventListener('change',render);

document.getElementById('chips').innerHTML=examples.map(e=>`<button class="chip" data-q="${esc(e)}">${esc(e)}</button>`).join('');
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{

}));
